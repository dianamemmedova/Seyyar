<main class="flex min-h-screen items-center justify-center bg-surface px-page-margin">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="flex w-full max-w-sm flex-col gap-gutter-md rounded-lg bg-surface-card p-gutter-xl shadow-card"
    novalidate
  >
    <div>
      <p class="text-label-lg text-primary">Seyyar Admin</p>
      <h1 class="text-headline-md">Daxil ol</h1>
    </div>

    @if (error(); as message) {
      <p
        class="rounded-md bg-terracotta-soft px-gutter-md py-gutter-sm text-body-md text-error"
        role="alert"
      >
        {{ message }}
      </p>
    }

    <label class="flex flex-col gap-gutter-xs">
      <span class="text-label-lg">E-poçt</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        class="rounded-md border border-outline bg-surface-card px-gutter-md py-3 text-body-md outline-none focus:border-primary"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="text-body-sm text-error">Düzgün e-poçt ünvanı yazın.</span>
      }
    </label>

    <label class="flex flex-col gap-gutter-xs">
      <span class="text-label-lg">Şifrə</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="rounded-md border border-outline bg-surface-card px-gutter-md py-3 text-body-md outline-none focus:border-primary"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="text-body-sm text-error">Şifrəni yazın.</span>
      }
    </label>

    <button
      type="submit"
      [disabled]="loading()"
      class="rounded-md bg-primary px-5 py-3 text-label-lg text-on-primary transition-opacity duration-150 disabled:opacity-60"
    >
      {{ loading() ? 'Yoxlanılır…' : 'Daxil ol' }}
    </button>
  </form>
</main>
